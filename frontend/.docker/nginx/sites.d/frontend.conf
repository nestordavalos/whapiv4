location = /sw.js {
    include include.d/nocache.conf;
    add_header Service-Worker-Allowed "/" always;
}

location = /manifest.webmanifest {
    include include.d/nocache.conf;
}

# The public backend wrapper applies the per-integration frame-ancestors
# allowlist. This inner SPA route must accept the complete nested ancestor
# chain; all other frontend routes keep the restrictive policy below.
location ^~ /embed/session/ {
    try_files /index.html =404;
    include include.d/nocache.conf;
    add_header Content-Security-Policy "frame-ancestors *" always;
}

location / {
    try_files $uri $uri/ /index.html;
    include include.d/nocache.conf;
    {{if .Env.BACKEND_FRAME_ORIGIN}}
    add_header Content-Security-Policy "frame-ancestors 'self' {{ .Env.BACKEND_FRAME_ORIGIN }}" always;
    {{else}}
    add_header X-Frame-Options SAMEORIGIN always;
    {{end}}
}

location /assets {
   alias /var/www/public/assets/;
   include include.d/allcache.conf;
}

include "include.d/spa.conf";
